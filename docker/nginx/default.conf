server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 12m;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fingerprinted Vite assets: cache forever.
    location /build/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Public uploads (product images), read from the shared storage volume.
    # Private files (receipts, exports) live outside storage/app/public and
    # are only reachable through authorized application routes.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller is executed; any other .php file is a 404.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    # Dotfiles (.env, .git...) are never served.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
