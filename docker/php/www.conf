; PHP-FPM pool overrides (loaded after the image's www.conf).
[www]
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers periodically to contain slow memory leaks.
pm.max_requests = 500

; Health check endpoint used by the container HEALTHCHECK (not routed by Nginx).
ping.path = /ping
ping.response = pong

; Keep the container environment available to PHP workers.
clear_env = no

; Log to the container output.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
