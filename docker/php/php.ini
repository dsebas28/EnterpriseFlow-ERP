; Application overrides on top of php.ini-production.

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off
date.timezone = UTC

; OPcache: code never changes inside a running container, so timestamps
; are not re-checked (set PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 to develop
; against a bind-mounted source tree).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.use_strict_mode = 1
